name: Build Farnava Market Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farnava-market-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify Farnava signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Farnava project files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "capacitor.config.json"
            "www/index.html"
            "www/app.js"
            "www/js/domain.js"
            "www/styles.css"
            "www/manifest.webmanifest"
            "scripts/smoke-test.mjs"
            "scripts/prepare-android.mjs"
            "scripts/configure-release-signing.mjs"
            "android-resources/res/values/farnava_colors.xml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required Farnava file is missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

      - name: Download licensed Persian fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/fonts www/font-licenses

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf" \
            -o www/fonts/vazirmatn-variable.ttf

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf" \
            -o www/fonts/lalezar-regular.ttf

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt" \
            -o www/font-licenses/Vazirmatn-OFL.txt

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/OFL.txt" \
            -o www/font-licenses/Lalezar-OFL.txt

          test -s www/fonts/vazirmatn-variable.ttf
          test -s www/fonts/lalezar-regular.ttf

      - name: Install JavaScript dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax and Farnava features
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prepare-android.mjs
          node --check scripts/configure-release-signing.mjs
          node --check scripts/smoke-test.mjs
          npm run check

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s www/app.bundle.js

      - name: Create or sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/app/build.gradle ]]; then
            if [[ -d android ]]; then
              echo "::error::The android directory exists but android/app/build.gradle is missing."
              find android -maxdepth 4 -type f -print || true
              exit 1
            fi
            npx cap add android
          fi

          npx cap sync android
          node scripts/prepare-android.mjs

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Verify Android minimum SDK
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f android/variables.gradle ]]; then
            grep -nE 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'android/variables.gradle',
            'android/app/build.gradle',
            'android/app/src/main/AndroidManifest.xml'
          ];

          const contents = files
            .filter(fs.existsSync)
            .map(file => fs.readFileSync(file, 'utf8'))
            .join('\n');

          const values = [
            ...contents.matchAll(
              /(?:\bminSdkVersion\s*=\s*|\bminSdkVersion\s+|android:minSdkVersion\s*=\s*["'])(\d+)/g
            )
          ].map(match => Number(match[1]));

          if (values.length === 0) {
            throw new Error('No numeric minSdkVersion declaration was found.');
          }

          if (values.some(value => value < 24)) {
            throw new Error(`minSdkVersion below 24 remains: ${values.join(', ')}`);
          }

          console.log(`Verified Android minSdkVersion values: ${values.join(', ')}`);
          NODE

      - name: Check required release secrets
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for SECRET_NAME in \
            FARNAVA_KEYSTORE_BASE64 \
            FARNAVA_KEYSTORE_PASSWORD \
            FARNAVA_KEY_ALIAS \
            FARNAVA_KEY_PASSWORD
          do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Missing GitHub repository secret: ${SECRET_NAME}"
              exit 1
            fi
          done

          echo "All required Farnava Release signing secrets are present."

      - name: Restore and validate Farnava release keystore
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/farnava-release.jks"

          printf '%s' "$FARNAVA_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          KEY_INFO="$RUNNER_TEMP/farnava-keystore-info.txt"

          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$FARNAVA_KEYSTORE_PASSWORD" \
            -alias "$FARNAVA_KEY_ALIAS" \
            > "$KEY_INFO"

          grep -q "PrivateKeyEntry" "$KEY_INFO"

          echo "FARNAVA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Farnava private release key was restored and validated."

      - name: Configure Gradle Release signing
        shell: bash
        env:
          FARNAVA_KEYSTORE_PATH: ${{ runner.temp }}/farnava-release.jks
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-release-signing.mjs

      - name: Build signed Release APK
        working-directory: android
        shell: bash
        env:
          FARNAVA_KEYSTORE_PATH: ${{ runner.temp }}/farnava-release.jks
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify package, alignment and exact Release certificate
        shell: bash
        env:
          FARNAVA_KEYSTORE_PATH: ${{ runner.temp }}/farnava-release.jks
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          CERT_FILE="$RUNNER_TEMP/farnava-release-cert.der"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected Release APK was not generated."
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -F "name='ir.farnava.app'"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          keytool -exportcert \
            -keystore "$FARNAVA_KEYSTORE_PATH" \
            -storepass "$FARNAVA_KEYSTORE_PASSWORD" \
            -alias "$FARNAVA_KEY_ALIAS" \
            -file "$CERT_FILE"

          EXPECTED_CERT_SHA256="$(
            sha256sum "$CERT_FILE" | awk '{print tolower($1)}'
          )"

          SIGNATURE_REPORT="$(
            "$BUILD_TOOLS/apksigner" verify \
              --verbose --print-certs "$APK"
          )"

          printf '%s\n' "$SIGNATURE_REPORT"

          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$SIGNATURE_REPORT" \
              | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F:]+).*/\1/p' \
              | head -n 1 \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          if [[ -z "$ACTUAL_CERT_SHA256" ]]; then
            echo "::error::Could not read the APK signing certificate SHA-256."
            exit 1
          fi

          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK certificate does not match the Farnava release keystore."
            echo "Expected SHA-256: $EXPECTED_CERT_SHA256"
            echo "Actual SHA-256:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "SUCCESS: APK is signed with the exact Farnava release certificate."

          mkdir -p market-artifact
          cp "$APK" market-artifact/Farnava-1.0.0-market-release.apk

          sha256sum \
            market-artifact/Farnava-1.0.0-market-release.apk \
            > market-artifact/SHA256SUMS.txt

          ls -lh market-artifact/

      - name: Upload signed Cafe Bazaar APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-market-release-v1.0.0
          path: |
            market-artifact/Farnava-1.0.0-market-release.apk
            market-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
