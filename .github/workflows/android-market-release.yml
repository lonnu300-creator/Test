name: Build Farnava Market Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farnava-market-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed Farnava APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Locate Farnava project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [[ -f "package.json" && -f "capacitor.config.json" ]]; then
            PROJECT_DIR="."
          else
            while IFS= read -r -d '' CONFIG_FILE; do
              CANDIDATE="$(dirname "$CONFIG_FILE")"
              if [[ -f "$CANDIDATE/package.json" ]]; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            done < <(
              find . -mindepth 2 -maxdepth 5 \
                -type f -name "capacitor.config.json" -print0
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find a folder containing both package.json and capacitor.config.json."
            echo "Repository root contents:"
            ls -la
            echo "Capacitor config files:"
            find . -maxdepth 5 -type f -name "capacitor.config.*" -print
            exit 1
          fi

          echo "Farnava project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Node dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Validate project and Capacitor configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.json

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const allDeps = {
            ...(pkg.dependencies || {}),
            ...(pkg.devDependencies || {})
          };

          const required = [
            '@capacitor/core',
            '@capacitor/android',
            '@capacitor/cli'
          ];

          const missing = required.filter(name => !allDeps[name]);

          if (missing.length) {
            console.error('Missing Capacitor dependencies:', missing.join(', '));
            process.exit(1);
          }

          const config = JSON.parse(
            fs.readFileSync('capacitor.config.json', 'utf8')
          );

          if (!config.appId || !config.appName) {
            console.error('capacitor.config.json must define appId and appName.');
            process.exit(1);
          }

          const webDir = config.webDir || 'www';

          console.log('App name:', config.appName);
          console.log('App ID:', config.appId);
          console.log('Web directory:', webDir);
          console.log('Capacitor dependencies: OK');

          fs.writeFileSync(
            process.env.GITHUB_ENV,
            `FARNAVA_WEB_DIR=${webDir}\n`,
            { flag: 'a' }
          );
          NODE

      - name: Build web application if a build script exists
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script found; using the existing web files."
          fi

      - name: Verify web entry point
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$FARNAVA_WEB_DIR/index.html" ]]; then
            echo "::error::Web entry point not found: $FARNAVA_WEB_DIR/index.html"
            echo "Available HTML files:"
            find . -maxdepth 5 -type f -name "index.html" -not -path "*/node_modules/*" -print
            exit 1
          fi
          echo "Web entry point found: $FARNAVA_WEB_DIR/index.html"

      - name: Prepare Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "android/app/build.gradle" ]]; then
            if [[ -d "android" ]]; then
              echo "::error::An android folder exists, but android/app/build.gradle is missing."
              find android -maxdepth 4 -type f -print || true
              exit 1
            fi

            npx cap add android
          fi

          npx cap sync android

          if [[ ! -f "android/app/build.gradle" ]]; then
            echo "::error::Capacitor did not create android/app/build.gradle."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Check release signing secrets
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for SECRET_NAME in \
            FARNAVA_KEYSTORE_BASE64 \
            FARNAVA_KEYSTORE_PASSWORD \
            FARNAVA_KEY_ALIAS \
            FARNAVA_KEY_PASSWORD
          do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Missing repository secret: $SECRET_NAME"
              exit 1
            fi
          done

      - name: Restore signing key and configure Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/farnava-release.jks"

          printf '%s' "$FARNAVA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$FARNAVA_KEYSTORE_PASSWORD" \
            -alias "$FARNAVA_KEY_ALIAS" >/dev/null

          {
            echo "FARNAVA_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "FARNAVA_KEYSTORE_PASSWORD=$FARNAVA_KEYSTORE_PASSWORD"
            echo "FARNAVA_KEY_ALIAS=$FARNAVA_KEY_ALIAS"
            echo "FARNAVA_KEY_PASSWORD=$FARNAVA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          cat > android/app/farnava-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  farnavaRelease {
                      storeFile file(System.getenv("FARNAVA_KEYSTORE_PATH"))
                      storePassword System.getenv("FARNAVA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("FARNAVA_KEY_ALIAS")
                      keyPassword System.getenv("FARNAVA_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.farnavaRelease
                  }
              }
          }
          GRADLE

          if ! grep -q "farnava-signing.gradle" android/app/build.gradle; then
            printf "\napply from: 'farnava-signing.gradle'\n" >> android/app/build.gradle
          fi

      - name: Build signed Release APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify and package APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Release APK was not found at the expected path."
            echo "Available APK files:"
            find android/app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

          mkdir -p market-artifact
          cp "$APK" market-artifact/Farnava-market-release.apk
          sha256sum market-artifact/Farnava-market-release.apk \
            > market-artifact/SHA256SUMS.txt

          ls -lh market-artifact/

      - name: Upload signed Market APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-market-release-apk
          path: |
            ${{ steps.project.outputs.dir }}/market-artifact/Farnava-market-release.apk
            ${{ steps.project.outputs.dir }}/market-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
