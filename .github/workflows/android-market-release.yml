name: Build Farnava Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: farnava-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Farnava Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate Farnava project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "package.json" && -f "capacitor.config.json" ]]; then
            PROJECT_DIR="."
          elif [[ -f "Farnava_Premium/package.json" && -f "Farnava_Premium/capacitor.config.json" ]]; then
            PROJECT_DIR="Farnava_Premium"
          else
            echo "::error::Farnava project files were not found."
            echo "Expected package.json and capacitor.config.json at repository root or inside Farnava_Premium/."
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT_DIR"

      - name: Validate Farnava project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/js/config.js

          node -e "const p=require('./package.json'); if (!p.dependencies?.['@capacitor/android'] || !p.dependencies?.['@capacitor/core']) throw new Error('Capacitor Android/Core dependencies are missing');"

      - name: Enable Premium preview for this debug build
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("www/js/config.js")
          content = path.read_text(encoding="utf-8")

          if "devPremiumPreview: false" in content:
              content = content.replace(
                  "devPremiumPreview: false",
                  "devPremiumPreview: true",
                  1
              )
          elif "devPremiumPreview: true" not in content:
              raise SystemExit("Could not locate devPremiumPreview setting in www/js/config.js")

          path.write_text(content, encoding="utf-8")
          print("Premium preview is enabled for this DEBUG build only.")
          PY

      - name: Install Node dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Create native Android project with Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "android/gradlew" || ! -d "android/app" ]]; then
            rm -rf android
            npx cap add android
          fi

          npx cap sync android

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradlew
          chmod +x android/gradlew

          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected APK was not generated: $APK"
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Farnava Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-premium-preview-debug-apk
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
