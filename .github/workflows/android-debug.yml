name: Build Farnava Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farnava-debug
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run Farnava automated checks
        run: npm run check

      - name: Build web application bundle
        run: |
          set -euo pipefail
          npm run build
          test -s www/app.bundle.js

      - name: Create or sync native Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/app/build.gradle ]]; then
            if [[ -d android ]]; then
              echo "::error::Android directory exists but app/build.gradle is missing."
              exit 1
            fi
            npx cap add android
          fi
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Set Android minimum SDK to 24 (Cordova 14 requirement)
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const files = [
            'android/variables.gradle',
            'android/app/build.gradle',
            'android/app/src/main/AndroidManifest.xml'
          ];

          let changed = false;

          for (const file of files) {
            if (!fs.existsSync(file)) continue;

            const original = fs.readFileSync(file, 'utf8');
            let updated = original;

            updated = updated.replace(
              /(^[ \t]*minSdkVersion[ \t]*=[ \t]*)\d+/gm,
              (_match, prefix) => {
                changed = true;
                return `${prefix}24`;
              }
            );

            updated = updated.replace(
              /(^[ \t]*minSdkVersion[ \t]+)\d+\b/gm,
              (_match, prefix) => {
                changed = true;
                return `${prefix}24`;
              }
            );

            updated = updated.replace(
              /(android:minSdkVersion[ \t]*=[ \t]*["'])\d+(["'])/g,
              (_match, prefix, suffix) => {
                changed = true;
                return `${prefix}24${suffix}`;
              }
            );

            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              console.log(`Updated minSdkVersion to 24 in ${file}`);
            }
          }

          const variablesFile = 'android/variables.gradle';
          const appGradleFile = 'android/app/build.gradle';
          const manifestFile = 'android/app/src/main/AndroidManifest.xml';

          const finalContents = [variablesFile, appGradleFile, manifestFile]
            .filter(fs.existsSync)
            .map(file => fs.readFileSync(file, 'utf8'))
            .join('\n');

          const numericMinSdkValues = [];

          for (const match of finalContents.matchAll(
            /(?:\bminSdkVersion\s*=\s*|\bminSdkVersion\s+|android:minSdkVersion\s*=\s*["'])(\d+)/g
          )) {
            numericMinSdkValues.push(Number(match[1]));
          }

          if (!changed && !numericMinSdkValues.includes(24)) {
            console.error('Could not find a numeric minSdkVersion setting to update.');
            console.error('Checked android/variables.gradle, android/app/build.gradle and AndroidManifest.xml.');
            process.exit(1);
          }

          if (numericMinSdkValues.some(value => value < 24)) {
            console.error('A minSdkVersion lower than 24 remains:', numericMinSdkValues);
            process.exit(1);
          }

          if (!numericMinSdkValues.includes(24)) {
            console.error('Could not verify minSdkVersion 24 after the update.');
            process.exit(1);
          }

          console.log('Verified: Android minSdkVersion is at least 24 for Cordova 14.');
          NODE

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
