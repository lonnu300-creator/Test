name: Build Farnava Unsigned Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farnava-unsigned-release
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "capacitor.config.json"
            "www/index.html"
            "www/app.js"
            "www/js/domain.js"
            "www/styles.css"
            "www/manifest.webmanifest"
            "scripts/smoke-test.mjs"
            "scripts/prepare-android.mjs"
            "scripts/configure-release-signing.mjs"
            "android-resources/res/values/farnava_colors.xml"
            ".github/workflows/android-debug.yml"
            ".github/workflows/android-market-release.yml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required project file is missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

      - name: Install JavaScript dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Remove misplaced shebang if present
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'scripts/prepare-android.mjs';
          let text = fs.readFileSync(file, 'utf8');
          const lines = text.split(/\r?\n/);
          const cleaned = lines.filter((line) => !line.trimStart().startsWith('#!'));

          if (cleaned.length !== lines.length) {
            fs.writeFileSync(file, cleaned.join('\n'), 'utf8');
            console.log('Removed stray shebang line from prepare-android.mjs.');
          } else {
            console.log('No stray shebang line found.');
          }
          NODE

      - name: Run Farnava smoke tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Build web application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s www/app.bundle.js

      - name: Create or sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            if [[ -d android ]]; then
              echo "::error::The android directory exists but the app Gradle file is missing."
              find android -maxdepth 4 -type f -print || true
              exit 1
            fi
            npx cap add android
          fi

          npx cap sync android
          node scripts/prepare-android.mjs

          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Ensure Release build has no signing configuration
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"
          if [[ ! -f "$GRADLE_FILE" ]]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          test -f "$GRADLE_FILE"

          if grep -Eq 'signingConfig[[:space:]]+signingConfigs\.(debug|release)' "$GRADLE_FILE"; then
            echo "::error::A signingConfig is present in the app Gradle file. Refusing to produce a misleading unsigned artifact."
            grep -n 'signingConfig' "$GRADLE_FILE" || true
            exit 1
          fi

          echo "No explicit signingConfig is assigned to the Release build."

      - name: Build unsigned Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify package, alignment and unsigned status
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected unsigned APK was not generated."
            echo "APK files produced by Gradle:"
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -F "name='ir.farnava.app'"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          if "$BUILD_TOOLS/apksigner" verify --verbose "$APK" \
              > "$RUNNER_TEMP/apk-signature-check.log" 2>&1; then
            echo "::error::The APK is signed. This workflow must produce an unsigned APK."
            cat "$RUNNER_TEMP/apk-signature-check.log"
            exit 1
          else
            echo "Confirmed: APK has no valid APK signing certificate."
            cat "$RUNNER_TEMP/apk-signature-check.log" || true
          fi

          mkdir -p unsigned-artifact
          cp "$APK" unsigned-artifact/Farnava-1.0.0-release-unsigned.apk
          sha256sum unsigned-artifact/Farnava-1.0.0-release-unsigned.apk \
            > unsigned-artifact/SHA256SUMS.txt

          ls -lh unsigned-artifact/

      - name: Upload unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-release-unsigned
          path: |
            unsigned-artifact/Farnava-1.0.0-release-unsigned.apk
            unsigned-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
