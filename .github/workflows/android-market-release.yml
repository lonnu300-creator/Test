name: Build Farnava Market Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farnava-market-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign Farnava 1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Farnava project files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "package.json"
            "capacitor.config.json"
            "www/index.html"
            "www/app.js"
            "www/js/domain.js"
            "www/styles.css"
            "www/manifest.webmanifest"
            "scripts/smoke-test.mjs"
            "scripts/prepare-android.mjs"
            "scripts/configure-release-signing.mjs"
            "android-resources/res/values/farnava_colors.xml"
            ".github/workflows/android-debug.yml"
            ".github/workflows/android-market-release.yml"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required Farnava file is missing: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

      - name: Download Vazirmatn and Lalezar fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/fonts www/font-licenses

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf" \
            -o www/fonts/vazirmatn-variable.ttf

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf" \
            -o www/fonts/lalezar-regular.ttf

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt" \
            -o www/font-licenses/Vazirmatn-OFL.txt

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/OFL.txt" \
            -o www/font-licenses/Lalezar-OFL.txt

          test -s www/fonts/vazirmatn-variable.ttf
          test -s www/fonts/lalezar-regular.ttf

      - name: Install JavaScript dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Run Farnava automated checks
        shell: bash
        run: npm run check

      - name: Build web application bundle
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s www/app.bundle.js

      - name: Create or sync native Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/app/build.gradle ]]; then
            if [[ -d android ]]; then
              echo "::error::The android directory exists but android/app/build.gradle is missing."
              find android -maxdepth 4 -type f -print || true
              exit 1
            fi
            npx cap add android
          fi

          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Set Android minimum SDK to 24 (Cordova 14 requirement)
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const files = [
            'android/variables.gradle',
            'android/app/build.gradle',
            'android/app/src/main/AndroidManifest.xml'
          ];

          let changed = false;

          for (const file of files) {
            if (!fs.existsSync(file)) continue;

            const original = fs.readFileSync(file, 'utf8');
            let updated = original;

            updated = updated.replace(
              /(^[ \t]*minSdkVersion[ \t]*=[ \t]*)\d+/gm,
              (_match, prefix) => {
                changed = true;
                return `${prefix}24`;
              }
            );

            updated = updated.replace(
              /(^[ \t]*minSdkVersion[ \t]+)\d+\b/gm,
              (_match, prefix) => {
                changed = true;
                return `${prefix}24`;
              }
            );

            updated = updated.replace(
              /(android:minSdkVersion[ \t]*=[ \t]*["'])\d+(["'])/g,
              (_match, prefix, suffix) => {
                changed = true;
                return `${prefix}24${suffix}`;
              }
            );

            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              console.log(`Updated minSdkVersion to 24 in ${file}`);
            }
          }

          const variablesFile = 'android/variables.gradle';
          const appGradleFile = 'android/app/build.gradle';
          const manifestFile = 'android/app/src/main/AndroidManifest.xml';

          const finalContents = [variablesFile, appGradleFile, manifestFile]
            .filter(fs.existsSync)
            .map(file => fs.readFileSync(file, 'utf8'))
            .join('\n');

          const numericMinSdkValues = [];

          for (const match of finalContents.matchAll(
            /(?:\bminSdkVersion\s*=\s*|\bminSdkVersion\s+|android:minSdkVersion\s*=\s*["'])(\d+)/g
          )) {
            numericMinSdkValues.push(Number(match[1]));
          }

          if (!changed && !numericMinSdkValues.includes(24)) {
            console.error('Could not find a numeric minSdkVersion setting to update.');
            console.error('Checked android/variables.gradle, android/app/build.gradle and AndroidManifest.xml.');
            process.exit(1);
          }

          if (numericMinSdkValues.some(value => value < 24)) {
            console.error('A minSdkVersion lower than 24 remains:', numericMinSdkValues);
            process.exit(1);
          }

          if (!numericMinSdkValues.includes(24)) {
            console.error('Could not verify minSdkVersion 24 after the update.');
            process.exit(1);
          }

          console.log('Verified: Android minSdkVersion is at least 24 for Cordova 14.');
          NODE

          test -f android/app/build.gradle
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Check release signing secrets
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for SECRET_NAME in \
            FARNAVA_KEYSTORE_BASE64 \
            FARNAVA_KEYSTORE_PASSWORD \
            FARNAVA_KEY_ALIAS \
            FARNAVA_KEY_PASSWORD
          do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Missing repository secret: ${SECRET_NAME}"
              exit 1
            fi
          done
          echo "All four signing secrets are present."

      - name: Restore keystore and configure Gradle signing
        shell: bash
        env:
          FARNAVA_KEYSTORE_BASE64: ${{ secrets.FARNAVA_KEYSTORE_BASE64 }}
          FARNAVA_KEYSTORE_PASSWORD: ${{ secrets.FARNAVA_KEYSTORE_PASSWORD }}
          FARNAVA_KEY_ALIAS: ${{ secrets.FARNAVA_KEY_ALIAS }}
          FARNAVA_KEY_PASSWORD: ${{ secrets.FARNAVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/farnava-release.jks"
          printf '%s' "$FARNAVA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$FARNAVA_KEYSTORE_PASSWORD" \
            -alias "$FARNAVA_KEY_ALIAS" >/dev/null

          export FARNAVA_KEYSTORE_PATH="$KEYSTORE_PATH"

          {
            echo "FARNAVA_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "FARNAVA_KEYSTORE_PASSWORD=$FARNAVA_KEYSTORE_PASSWORD"
            echo "FARNAVA_KEY_ALIAS=$FARNAVA_KEY_ALIAS"
            echo "FARNAVA_KEY_PASSWORD=$FARNAVA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          node scripts/configure-release-signing.mjs

      - name: Build signed Release APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Release APK was not generated."
            find android/app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | grep -F "name='ir.farnava.app'"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose --print-certs "$APK"

          mkdir -p market-artifact
          cp "$APK" market-artifact/Farnava-1.0.0-market-release.apk
          sha256sum market-artifact/Farnava-1.0.0-market-release.apk \
            > market-artifact/SHA256SUMS.txt
          ls -lh market-artifact/

      - name: Upload signed Market APK
        uses: actions/upload-artifact@v4
        with:
          name: farnava-market-release-v1.0.0
          path: |
            market-artifact/Farnava-1.0.0-market-release.apk
            market-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
